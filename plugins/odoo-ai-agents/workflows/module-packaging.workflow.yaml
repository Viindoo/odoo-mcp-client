# Paths (resolve each root once and substitute the captured absolute path; never a cwd-relative
#   .odoo-ai/ path - snippets/state-root-resolution.md):
#   <OUT>  = output_dir below as workflow-chaining resolves it (ISOLATE, never the cwd). Run
#            artifacts: <OUT>/<run>/ (scope.yaml, doc-plan.yaml, index.jsonl) and
#            <OUT>/<run>/<module>/manifest-audit.md.
#   <DOC>  = <SHARE_DIR>/documentation/<run>/ (project_dir, axis share, cwd = doc_root). Per
#            module, <DOC><module>/ holds feature-catalog.jsonl/.md, role-map.json,
#            walkthrough.jsonl/.md, buyer-profile.md and the marketing copy.
#   doc_root = the linked worktree every module-tree write and commit lands in: the scope phase
#            classifies the target checkout, and the decided workflow plan creates the worktree
#            when that target is a principal checkout.
name: module-packaging
domain: content
team_pattern: Pipeline
description: |
  End-to-end, dependency-aware module packaging: scope modules + languages, plan the doc package
  by dependency shape (clusters, branch-aware instance allocation, leaf-dependency-first order,
  dedup of modules already documented), then build a feature catalog with role map and usage
  walkthroughs, design the module icon, draft per-locale marketing copy (doc:true modules only),
  provision instances per the plan and run a per-instance incremental install -> capture ->
  verify -> commit loop on a DB holding ONLY that module plus its deps, then audit App-Store
  manifest keys and aggregate a run index. The whole plan is decided once, before any instance
  is provisioned.
  Trigger: "package module for the Apps Store", "module documentation
  end-to-end", "viết tài liệu module đầy đủ", "tạo landing page module", "icon + landing + user
  guide for module", "full doc pipeline", "đóng gói module Odoo", "dependency-aware module doc
  package", "doc pipeline for a module cluster", "module packaging workflow"
output_dir: .odoo-ai/packaging
inputs:
  - modules

resume: true
fallback: standalone

phases:
  - id: scope
    inline: true
    model_tier: inherit
    # Establish <run> = doc-run-<timestamp>. Every PER-MODULE artifact gets a <module>/ subdir
    # under <OUT>/<run>/ or <DOC> (avoids flat-path collision when the run covers several modules).
    # FIRST classify doc_root - classify only, this phase writes nothing to any module tree.
    # doc_root = the worktree the run passes (the plan runner or the caller made it), else the top
    # level of the repo holding the modules. One `repo_facts` call on doc_root tells the kinds
    # apart (snippets/git-delegation.md): is_linked_worktree true = doc_root_kind: worktree (used
    # as is for the whole run); false = doc_root_kind: principal (scoped and planned read-only
    # here; the docs worktree is created only once the workflow plan is decided).
    # Then resolve target modules from the `modules` input (module name or absolute path; walk
    # __manifest__.py files for multi-module repos), every abs_path under doc_root, and fill the
    # scope block fields - version, languages, doc_layer, has_demo, depends_in_scope,
    # has_ondisk_doc, change, target_market - per skills/_shared/doc-cluster-plan.md § Input
    # (languages per skills/odoo-doc-illustration/SKILL.md § Language resolution), writing
    # under the packaging run dir. An explicit `doc_layer` input overrides every module's value;
    # pass it only when every module in the run shares one layer. The workflow plan confirms each
    # proposed target_market once.
    # Set `change: whole` on every module named by the `modules` input: a packaging run re-documents
    # a module that already has docs on disk, so none is skipped as existing-on-disk.
    # For a principal doc_root, once the modules are resolved, call `repo_facts` with
    # `status_paths` = each module abs_path and record what `dirty` lists as
    # uncommitted: the docs worktree starts at HEAD, so those changes would go undocumented.
    # Emits scope block: doc_root, doc_root_kind, uncommitted + modules[] with {name, abs_path,
    # languages, doc_layer, has_demo, version, depends_in_scope, has_ondisk_doc, change, target_market}.
    # Written to <OUT>/<run>/scope.yaml for all downstream phases.

  - id: doc-plan
    inline: true
    plan: true
    model_tier: sonnet
    # Produce the doc-package plan with plan_source: scope (doc-only standalone path). Read the
    # scope block at
    # <OUT>/<run>/scope.yaml - modules[] with depends_in_scope[] and has_ondisk_doc.
    # Build the in-scope sub-graph and compute, per skills/_shared/doc-cluster-plan.md:
    #   - CLUSTERS: connected components of the in-scope sub-graph.
    #   - Leaf-dependency-first topological order within each cluster.
    #   - BRANCH-AWARE instance allocation (default purity: strict-branch):
    #       (a) linear chain  -> ONE persistent instance, installed incrementally leaf-first;
    #       (b) independent branches -> a SEPARATE pure instance each (no sibling menus leak);
    #       (c) convergence node -> REUSE one branch instance + install only the still-missing
    #           FILL (other branches + the node), then doc the node on the complete DB.
    #   - DEDUP (doc_owner map, doc:true|false): a module is doc'd exactly once globally; shared
    #     deps, convergence-fill modules already doc'd, and has_ondisk_doc modules become
    #     doc:false (install-only) with a dedup_reason - unless a change (feature list or whole) is given.
    #   - install_doc_sequence[] per instance (module, doc, install_step, install_delta,
    #     depends_in_scope, extends_in_scope) + convergence[] for branching clusters.
    #   - Inter-instance parallelism W = min(#independent instance-paths, browser-family pool,
    #     ephemeral instance cap) with within_path: sequential; a batch schedule[].
    #   - Per-step build inputs (instance_build: demo on, languages = the resolved locales,
    #     skip-auto-install in extra_args spelled via OSM cli_help).
    # Optional brief overrides consumed if present: CHANGE (per module, update or re-doc), MAX_CLUSTER_MODULES
    # (split threshold, default ~6), purity (strict-branch | fresh-per-module).
    # OSM-verify the disk edges opportunistically (trust-but-verify) with the CONCRETE version.
    # Write ONE doc-plan.yaml conforming to the doc-cluster-plan.md schema to
    # <OUT>/<run>/doc-plan.yaml (header: plan_kind: doc-package, plan_source: scope,
    # grounded: osm|local-source, scope_ref). Planning needs no instance and no browser.
    # When scope.yaml lists uncommitted changes, ask one text question before the plan is
    # presented: the user commits them first (then the run continues), or the run documents HEAD
    # without them - never proceed silently.
    # This output is the workflow plan (workflow-chaining presents it once, as a whole - never per
    # cluster): all clusters + branch-aware instance allocation + install/doc order + dedup
    # (doc:true/false, with the already-documented choice of doc-cluster-plan.md § 5) + the
    # parallelism schedule (W) + one proposed target_market row per appstore module (recorded in
    # scope.yaml once decided). `refine` re-runs the plan with the feedback; `cancel` aborts
    # BEFORE any instance is provisioned or any worktree created.
    # Once the plan is decided, BEFORE the feature-map phase and every later phase: when scope.yaml's doc_root_kind is
    # principal, invoke git-toolkit:git-ops (Skill tool) for a new worktree + docs branch at that
    # checkout's HEAD commit, named explicitly. In scope.yaml, record the worktree as doc_root and
    # its branch, and re-root every modules[].abs_path into it (same path relative to the repo top
    # level). Every later phase reads doc_root and abs_path from scope.yaml, so no phase writes to
    # the principal checkout. The run summary (aggregate-index) names the worktree and branch; nothing is
    # merged or pushed.

  - id: feature-map
    skill: odoo-doc-feature-map
    nl_trigger: >
      Process ONLY modules with doc:true in <OUT>/<run>/doc-plan.yaml (skip
      doc:false dedup modules - do NOT catalog a module installed only as a dependency).
      Using the scope block at <OUT>/<run>/scope.yaml, enumerate every feature,
      screen, and capability each in-scope module ships - OSM-first (describe_module, module_inspect,
      model_inspect, check_module_exists; disk fallback for ACL from
      security/ir.model.access.csv and security/*.xml). Per module produce the three shared files
      under <DOC><module>/: feature-catalog.jsonl (machine SSOT: feature_id, name,
      menu_path, entry_point, models, key_fields, roles, states, depends_on, value, grounded)
      with feature-catalog.md (human report), role-map.json (the business roles, what each can
      do, and the process stages across them) and walkthrough.jsonl with walkthrough.md (one
      happy-path scenario per role task, positive journeys only - not a QA oracle, NOT bound by
      acceptance-oracle-contract.md). The catalog feeds the landing Key-Features grid; the role
      map drives the guide's Overview and per-role chapters and the buyer profile in later
      phases; the walkthrough feeds the scenario-driven capture. Standalone-first; no
      browser or live instance required. Fan out one worker per doc:true module (Mode B); each worker
      writes to its own <DOC><module>/ subdir.
    model_tier: sonnet
    fanout: true
    chunk_by: modules

  - id: icon
    skill: odoo-icon-design
    nl_trigger: >
      For each module with doc:true in <OUT>/<run>/doc-plan.yaml (skip doc:false
      dedup modules), using <OUT>/<run>/scope.yaml (WORKTREE_PATH = its doc_root), design the
      module identity icon per the odoo-icon-design skill. Fan out one worker per doc:true
      module (Mode B).
    model_tier: sonnet
    fanout: true
    chunk_by: modules

  - id: copy
    skill: odoo-content-draft
    nl_trigger: >
      For each module with doc:true AND doc_layer in {appstore, both} in
      <OUT>/<run>/doc-plan.yaml (skip doc:false dedup modules AND skip
      doc_layer: userguide-only modules - no static/description/index.html is produced for them,
      so App-Store landing copy would have nothing to fill), using
      <OUT>/<run>/scope.yaml, draft App-Store landing copy for
      every resolved language (English canonical mandatory; per-locale variants per languages[]
      from scope.yaml). Channel: landing-page copy. Brief: FEATURE CATALOG =
      <DOC><module>/feature-catalog.jsonl, ROLE MAP = <DOC><module>/role-map.json, the module
      descriptor, and TARGET MARKET = the module's target_market recorded in scope.yaml.
      The buyer profile comes first: save the `## Buyer profile` block of the output as
      <DOC><module>/buyer-profile.md, and every language's copy under <DOC><module>/. Copy:
      one HTML-comment block per copy-sourced key of
      skills/odoo-doc-illustration/references/app-store-template.md § Section Map, and
      [Image: slug] placeholders for screenshots not yet captured. Emit status: NEEDS_NEXT ->
      odoo-doc-illustration to fill [Image:] markers with live screenshots. No browser or live
      instance required. Fan out one worker per doc:true module (Mode B); aggregate per-module
      buyer profiles and per-locale copy.
    model_tier: sonnet
    fanout: true
    chunk_by: modules

  # Delegates entirely to odoo-doc-illustration, which owns the branch-aware per-instance
  # incremental loop. The feature-map and copy phases pre-fetched the catalog, role map,
  # walkthrough, buyer profile and copy: forward them, the skill does not re-fetch them.
  # SEQUENTIAL within a dependency-path; PARALLEL across independent instance-paths up to W.
  # Browser families are exclusive-serial per family.
  - id: provision-capture
    skill: odoo-doc-illustration
    nl_trigger: >
      Delegate to the odoo-doc-illustration skill, which owns the per-instance incremental
      provision-capture loop. Forward: WORKTREE_PATH = scope.yaml's doc_root (a linked worktree -
      the skill uses it as is), doc-plan at <OUT>/<run>/doc-plan.yaml, scope at
      <OUT>/<run>/scope.yaml, CAPTURE MODE: scenarios, DOC SCOPE: full-guide, and per module from
      <DOC><module>/: FEATURE CATALOG (feature-catalog.jsonl), ROLE MAP (role-map.json),
      WALKTHROUGH (walkthrough.jsonl), BUYER PROFILE (buyer-profile.md), MARKETING COPY (the
      per-locale copy) and TARGET MARKET (the confirmed target_market) - do NOT re-fetch; pass
      directly to the skill.
    model_tier: sonnet

  - id: manifest-audit
    inline: true
    model_tier: haiku
    # For each module with doc:true in <OUT>/<run>/doc-plan.yaml (skip doc:false
    # dedup modules - they are install-only deps, not documented), audit App-Store manifest keys
    # in doc_root:
    #   REQUIRED (blocking if missing): name, summary, description, license, category
    #   IMAGES (blocking): run the reference gate of snippets/module-doc-references.md on the
    #     module (no file arguments); any MANIFEST_IMAGE, MANIFEST_COVER or IMG_COVER_NOT_SHOWN
    #     finding is a blocking gap in the cover or the manifest images - the gate owns both rules
    #   RECOMMENDED (warning if missing): support, website, maintainer, application
    #   OPTIONAL (info): live_test_url, price, currency, version
    # Suggest values for missing non-commercial fields. NEVER fabricate commercial keys
    # (price / live_test_url / currency - these are instance/commercial-specific and must
    # only be set by the module owner). Score each module: required-missing = blocking,
    # recommended-missing = warning, optional-missing = info. Write per-module results to
    # <OUT>/<run>/<module>/manifest-audit.md.

  - id: aggregate-index
    inline: true
    model_tier: inherit
    # Collect all per-module output paths (icon.png, index.html, doc/index.rst, per-locale
    # variants, feature-catalog.md, role-map.json, walkthrough.jsonl, walkthrough.md,
    # buyer-profile.md, manifest-audit.md) for each doc:true module from doc_root, <DOC><module>/
    # and <OUT>/<run>/<module>/, and write a combined run index at <OUT>/<run>/index.jsonl
    # listing every artifact:
    # {module, locale, artifact_type, path, status: captured|degraded|placeholder}.
    # Emit a run summary to the user: doc_root (and its branch when doc-plan created the worktree),
    # modules packaged (doc:true), modules skipped as install-only
    # deps (doc:false + dedup_reason), instances allocated, locales covered, total artifacts,
    # any `concerns:` items (capture downgrades, W=1 serialization, missing rasterizer,
    # locale fallbacks, manifest-audit blocking gaps). Note: final HTML/RST artifacts and images
    # are committed in the module tree under doc_root (e.g. <module>/static/description/index.html);
    # <DOC> holds the catalog, role map, walkthroughs, buyer profile and copy; <OUT>/<run>/ holds
    # scope.yaml, doc-plan.yaml, the audit reports and the run index.
