# module-packaging.workflow.yaml
# Declarative SSOT for the end-to-end, dependency-aware module packaging pipeline.
# Runner: skills/workflow-chaining - auto-discovered at runtime.
# Phase 0 scope + Phase 0.5 doc-plan are browser-free planning (ONE whole-plan gate).
# Content phases 1-4 (feature-map / walkthrough / icon / copy) fan out per module (Mode B)
#   but process ONLY doc:true modules (dedup skips modules installed only as a dependency).
# Phase 5 provision-capture is the ONLY browser-bound + instance-touching phase - it delegates
#   to skill odoo-doc-illustration (the branch-aware per-instance incremental loop SSOT):
#   SEQUENTIAL within a dependency-path, PARALLEL across independent instance-paths up to W.
#   Browser families are exclusive-serial per family.
# Paths (resolve each root once and substitute the captured absolute path; never a cwd-relative
#   .odoo-ai/ path - snippets/state-root-resolution.md):
#   <OUT>  = output_dir below as workflow-chaining resolves it: under the state root (ISOLATE),
#            never the cwd. Run artifacts: <OUT>/<run>/ (scope.yaml, doc-plan.yaml, index.jsonl)
#            and <OUT>/<run>/<module>/manifest-audit.md.
#   <DOC>  = <SHARE_DIR>/documentation/<run>/ (project_dir, axis share, cwd = doc_root) - the
#            documentation cache the doc skills share. Per module, <DOC><module>/ holds
#            feature-catalog.jsonl/.md, role-map.json, walkthrough.jsonl/.md, buyer-profile.md
#            and the marketing copy.
#   doc_root = the linked worktree every module-tree write and commit lands in: Phase 0 classifies
#            the target checkout, and approving the Phase 0.5 gate creates the worktree when that
#            target is a principal checkout.
name: module-packaging
domain: content
team_pattern: Pipeline
description: |
  End-to-end, dependency-aware module packaging: scope modules + languages, then plan the doc
  package by dependency SHAPE (partition into clusters, allocate instances branch-aware - a
  linear chain shares one incremental instance, each independent branch gets its own pure
  instance, a convergence node reuses a branch instance + installs the fill - order installs
  leaf-dependency-first, and dedup modules already doc'd on disk or on another instance). Then
  build a feature catalog, author usage walkthroughs, design the module icon, draft per-locale
  marketing copy (all for doc:true modules only), provision instances per the plan and run a
  per-instance incremental install -> capture -> verify -> commit loop that documents each module
  on a DB holding ONLY that module plus its deps (no reverse-dependent - pure, extension-free
  screenshots), then audit App-Store manifest keys and aggregate a run index. The whole plan is
  approved at a SINGLE gate before any instance is provisioned; content phases fan out per module;
  the provision-capture phase is browser-bound, serial within a dependency-path and parallel
  across independent paths. Trigger: "package module for the Apps Store", "module documentation
  end-to-end", "viết tài liệu module đầy đủ", "tạo landing page module", "icon + landing + user
  guide for module", "full doc pipeline", "đóng gói module Odoo", "dependency-aware module doc
  package", "doc pipeline for a module cluster", "module packaging workflow"
output_dir: .odoo-ai/packaging
inputs:
  - modules

resume: true
fallback: standalone

phases:
  # ------------------------------------------------------------------
  # Phase 0 - Scope: resolve modules, languages, doc_layer, dependency edges (inline)
  # Browser-free. FIRST phase - everything else depends on this output.
  # ------------------------------------------------------------------
  - id: scope
    inline: true
    model_tier: inherit
    # Establish <run> = doc-run-<timestamp>. Every PER-MODULE artifact gets a <module>/ subdir
    # under <OUT>/<run>/ or <DOC> (avoids flat-path collision when the run covers several modules).
    # FIRST classify doc_root - classify only, this phase writes nothing to any module tree.
    # doc_root = the worktree the run passes (run-harness or the caller made it), else the top
    # level of the repo holding the modules. One bounded read tells the kinds apart
    # (snippets/git-delegation.md § Bounded-read allowlist):
    # `git -C <doc_root> rev-parse --path-format=absolute --git-dir --git-common-dir` - two
    # different paths = doc_root_kind: worktree (used as is for the whole run); the same path
    # twice = doc_root_kind: principal (scoped and planned read-only here; the docs worktree is
    # created only once the Phase 0.5 gate approves).
    # Then resolve target modules from the `modules` input (module name or absolute path; walk
    # __manifest__.py files for multi-module repos), every abs_path under doc_root. Resolve
    # per-module doc_layer, version, and has_demo by APPLYING the resolver contract defined in
    # agent `odoo-doc-scoper` - that agent's I/O contract is the SSOT for doc_layer
    # (appstore | userguide | both) detection, version inference, the has_demo flag, AND the two
    # dependency-planning fields below. Resolve
    # per-module LANGUAGES via the single language-resolution SSOT:
    # skills/odoo-doc-illustration/SKILL.md § Language resolution (4-tier + disk-UNION,
    # English-mandatory) - odoo-doc-scoper cross-refs the same SSOT rather than owning it. Do NOT
    # reimplement either resolver here; this inline phase only adapts their output location to the
    # packaging run dir.
    # Two fields the doc-plan phase (0.5) consumes:
    #   - depends_in_scope[]: per module, the subset of __manifest__['depends'] that is ALSO in
    #     modules[] (the in-scope dependency edges). Empty = no in-scope dependency.
    #   - has_ondisk_doc: true if <module>/static/description/index.html OR <module>/doc/index.rst
    #     already exists (feeds cross-run dedup in the planner).
    # `doc_layer` defaults to PER-MODULE AUTO-DETECTION from disk (odoo-doc-scoper Step 5: disk has
    # static/description/ -> appstore capability, disk has doc/ -> userguide capability, both
    # present -> both). An explicit `doc_layer` input OVERRIDES ALL modules uniformly with one
    # value - this DEFEATS per-module detection, so pass it sparingly (only when every module in
    # the run genuinely shares one doc_layer). `languages` defaults per the language-resolution
    # SSOT above (English always added); collect either interactively only when genuinely
    # unresolvable from the inputs above.
    # Propose target_market per module whose doc_layer is appstore or both, from its descriptor,
    # per skills/odoo-content-draft/references/buyer-profile.md § Target market (a value the brief
    # carries is used as is); Phase 0.5's gate confirms it once.
    # Emits scope block: doc_root, doc_root_kind + modules[] with {name, abs_path, languages,
    # doc_layer, has_demo, version, depends_in_scope, has_ondisk_doc, target_market}.
    # Written to <OUT>/<run>/scope.yaml for all downstream phases.

  # ------------------------------------------------------------------
  # Phase 0.5 - Doc plan: dependency-aware, branch-aware schedule (inline) + SINGLE plan gate
  # Browser-free. Reuses the `odoo-doc-planner` I/O contract inline (parity with how phase 0
  # reuses the doc-scoper contract) and the algorithm SSOT skills/_shared/doc-cluster-plan.md.
  # ------------------------------------------------------------------
  - id: doc-plan
    inline: true
    model_tier: sonnet
    gate: "approve / refine: [feedback] / cancel"
    # Produce the doc-package plan by APPLYING the `odoo-doc-planner` contract with
    # plan_source: scope (doc-only standalone path). Read the scope block at
    # <OUT>/<run>/scope.yaml - modules[] with depends_in_scope[] and has_ondisk_doc.
    # Build the in-scope sub-graph and compute, per skills/_shared/doc-cluster-plan.md (the SSOT
    # algorithm - do NOT restate it here):
    #   - CLUSTERS: connected components of the in-scope sub-graph.
    #   - Leaf-dependency-first topological order within each cluster.
    #   - BRANCH-AWARE instance allocation (default purity: strict-branch):
    #       (a) linear chain  -> ONE persistent instance, installed incrementally leaf-first;
    #       (b) independent branches -> a SEPARATE pure instance each (no sibling menus leak);
    #       (c) convergence node -> REUSE one branch instance + install only the still-missing
    #           FILL (other branches + the node), then doc the node on the complete DB.
    #   - DEDUP (doc_owner map, doc:true|false): a module is doc'd exactly once globally; shared
    #     deps, convergence-fill modules already doc'd, and has_ondisk_doc modules become
    #     doc:false (install-only) with a dedup_reason - unless REDOC: true is passed.
    #   - install_doc_sequence[] per instance (module, doc, install_step, install_delta,
    #     depends_in_scope, extends_in_scope) + convergence[] for branching clusters.
    #   - Inter-instance parallelism W = min(#independent instance-paths, browser-family pool,
    #     ephemeral instance cap) with within_path: sequential; a batch schedule[].
    #   - Per-step build inputs (instance_build: demo on, languages = the resolved locales,
    #     skip-auto-install in extra_args spelled via OSM cli_help).
    # Optional brief overrides consumed if present: REDOC (cross-run re-doc), MAX_CLUSTER_MODULES
    # (split threshold, default ~6), purity (strict-branch | fresh-per-module).
    # OSM-verify the disk edges opportunistically (trust-but-verify) with the CONCRETE version.
    # Write ONE doc-plan.yaml conforming to the doc-cluster-plan.md schema to
    # <OUT>/<run>/doc-plan.yaml (header: plan_kind: doc-package, plan_source: scope,
    # grounded: osm|local-source, scope_ref). Standalone-first: the whole algorithm is
    # disk-resolvable - no instance and no browser needed to plan.
    # GATE: present the WHOLE plan - all clusters + branch-aware instance allocation + install/doc
    # order + dedup (doc:true/false) + the parallelism schedule (W) + one proposed target_market
    # row per appstore module (confirmed here once, then recorded in scope.yaml) - for ONE approval
    # (approve / refine: [feedback] / cancel). This is the SINGLE plan gate - NOT a gate per
    # cluster: the purity/dedup/allocation trade-offs are only legible as a whole picture.
    # `refine` re-runs the plan with the feedback; `cancel` aborts BEFORE any instance is
    # provisioned or any worktree created.
    # On approve, BEFORE Phase 1 and every later phase: when scope.yaml's doc_root_kind is
    # principal, invoke git-toolkit:git-ops (Skill tool) for a new worktree + docs branch at that
    # checkout's HEAD commit, named explicitly. In scope.yaml, record the worktree as doc_root and
    # its branch, and re-root every modules[].abs_path into it (same path relative to the repo top
    # level). Every later phase reads doc_root and abs_path from scope.yaml, so no phase writes to
    # the principal checkout. The run summary (Phase 7) names the worktree and branch; nothing is
    # merged or pushed.

  # ------------------------------------------------------------------
  # Phase 1 - Feature catalog (browser-free, fan-out per doc:true module - Mode B)
  # ------------------------------------------------------------------
  - id: feature-map
    skill: odoo-doc-feature-map
    nl_trigger: >
      Process ONLY modules with doc:true in <OUT>/<run>/doc-plan.yaml (skip
      doc:false dedup modules - do NOT catalog a module installed only as a dependency).
      Using the scope block at <OUT>/<run>/scope.yaml, enumerate every feature,
      screen, and capability each in-scope module ships - OSM-first (describe_module, module_inspect,
      model_inspect, check_module_exists; disk fallback for ACL from
      security/ir.model.access.csv and security/*.xml). Per module produce three files under
      <DOC><module>/: feature-catalog.jsonl (machine SSOT: feature_id, name,
      menu_path, entry_point, models, key_fields, roles, states, depends_on, value, grounded),
      feature-catalog.md (human report) and role-map.json (the business roles, what each can do,
      and the process stages across them). The catalog feeds the landing Key-Features grid; the
      role map drives the guide's Overview and per-role chapters, the walkthroughs and the buyer
      profile in later phases. Standalone-first; no
      browser or live instance required. Fan out one worker per doc:true module (Mode B); each worker
      writes to its own <DOC><module>/ subdir before gate.
    model_tier: sonnet
    fanout: true
    chunk_by: modules
    gate: "approve / refine: [feedback] / cancel"

  # ------------------------------------------------------------------
  # Phase 2 - Usage walkthroughs (browser-free, fan-out per doc:true module - Mode B)
  # Requires: feature-catalog.jsonl + role-map.json from P1.
  # ------------------------------------------------------------------
  - id: walkthrough
    skill: odoo-doc-walkthrough
    nl_trigger: >
      Process ONLY modules with doc:true in <OUT>/<run>/doc-plan.yaml (skip
      doc:false dedup modules). Using the feature catalog at
      <DOC><module>/feature-catalog.jsonl as CATALOG_PATH, the role map at
      <DOC><module>/role-map.json as ROLE_MAP_PATH, and the scope block at
      <OUT>/<run>/scope.yaml, author happy-path usage scenarios for each in-scope
      module: narrative + structured steps[] (action, target, value, note per step) grounded
      in the module's actual behavior from source. Per module, produce walkthrough.jsonl (machine
      SSOT with steps[]) + walkthrough.md (human narrative) under <DOC><module>/,
      consumed by the provision-capture phase for scenario-driven per-step capture. Positive happy-path
      journeys only - not a QA oracle, NOT bound by acceptance-oracle-contract.md.
      Standalone-first; no browser or live instance required. Fan out one worker
      per doc:true module (Mode B); aggregate before gate.
    model_tier: sonnet
    fanout: true
    chunk_by: modules
    gate: "approve / refine: [feedback] / cancel"

  # ------------------------------------------------------------------
  # Phase 3 - Icon design (browser-free, fan-out per doc:true module - Mode B)
  # Independent of P1-P2; no browser or live instance required.
  # ------------------------------------------------------------------
  - id: icon
    skill: odoo-icon-design
    nl_trigger: >
      For each module with doc:true in <OUT>/<run>/doc-plan.yaml (skip doc:false
      dedup modules), using <OUT>/<run>/scope.yaml (WORKTREE_PATH = its doc_root), design a
      brand-aware,
      version-correct module identity icon. Compose SVG with era-correct style (skeuo for v8-v10;
      flat solid for v11-v16; flat-shadow material for v17-v19); rasterize to icon.png 256x256 via
      the first detected rasterizer in order: rsvg-convert -> inkscape -> magick/convert
      (ImageMagick) -> cairosvg -> Pillow. If no rasterizer is found, write icon.svg only and emit a
      WARNING with copy-paste install instructions for Ubuntu (librsvg2-bin or imagemagick), macOS
      (brew install librsvg), and Python (pip install cairosvg); set status:
      NEEDS_CONTEXT(no SVG rasterizer; icon.svg written, icon.png pending). Write to
      <module>/static/description/icon.png; on v19 also write icon.svg and merge the manifest
      'icon' key (read-before-edit). Brand-agnostic: resolve the palette per the odoo-icon-design
      brand-token rule (the SHARE brand-token map when it exists, then module-category hue), else
      the Odoo default (#714B67). Fan out one worker per doc:true module (Mode B).
      Per its Verify-then-commit step, the odoo-icon-design skill commits icon.png/icon.svg/the
      manifest 'icon' key via git-toolkit:git-ops - the icon assets are never left uncommitted.
    model_tier: sonnet
    fanout: true
    chunk_by: modules
    gate: "approve / refine: [feedback] / cancel"   # refine: [feedback] re-generates the icon with that feedback

  # ------------------------------------------------------------------
  # Phase 4 - Buyer profile + marketing copy (browser-free, fan-out per doc:true module - Mode B)
  # Requires: feature-catalog.jsonl + role-map.json from P1, target_market from P0/P0.5.
  # ------------------------------------------------------------------
  - id: copy
    skill: odoo-content-draft
    nl_trigger: >
      For each module with doc:true AND doc_layer in {appstore, both} in
      <OUT>/<run>/doc-plan.yaml (skip doc:false dedup modules AND skip
      doc_layer: userguide-only modules - no static/description/index.html is produced for them,
      so App-Store landing copy would have nothing to fill), using
      <OUT>/<run>/scope.yaml, draft App-Store landing copy for
      every resolved language (English canonical mandatory; per-locale variants per languages[]
      from scope.yaml). Channel: landing-page copy. Brief: FEATURE CATALOG =
      <DOC><module>/feature-catalog.jsonl, ROLE MAP = <DOC><module>/role-map.json, the module
      descriptor, and TARGET MARKET = the module's target_market confirmed at the Phase 0.5 gate.
      The buyer profile comes first: save the `## Buyer profile` block of the output as
      <DOC><module>/buyer-profile.md, and every language's copy under <DOC><module>/. Copy:
      one HTML-comment block per copy-sourced key of
      skills/odoo-doc-illustration/references/app-store-template.md § Section Map, and
      [Image: slug] placeholders for screenshots not yet captured. When the module's doc-plan
      entry has a non-empty extends_in_scope[], add a one-line "Extends <base> - see its
      documentation" pointer (D13.7 cross-reference hint). Emit status: NEEDS_NEXT ->
      odoo-doc-illustration to fill [Image:] markers with live screenshots. No browser or live
      instance required. Fan out one worker per doc:true module (Mode B); aggregate per-module
      buyer profiles and per-locale copy before gate.
    model_tier: sonnet
    fanout: true
    chunk_by: modules
    gate: "approve / refine: [feedback] / cancel"

  # ------------------------------------------------------------------
  # Phase 5 - Provision + capture (delegated to skill odoo-doc-illustration)
  # The ONLY instance-touching + browser-bound phase. Delegates entirely to the
  # odoo-doc-illustration skill, which is the branch-aware per-instance incremental loop SSOT
  # (D14.2/D14.3): provision via odoo-instance, capture via the skill's two writers (one per
  # audience, SEQUENTIAL on the same instance handle), verify, commit via git-ops, advance
  # next-delta. The workflow does NOT restate the loop mechanics here.
  # Phases 1, 2 and 4 pre-fetched the catalog, role map, walkthrough, buyer profile and copy; the
  # skill does NOT re-fetch them on this workflow path (they are forwarded directly).
  # SEQUENTIAL within a dependency-path; PARALLEL across independent instance-paths up to W.
  # Requires: P1 (feature-catalog.jsonl, role-map.json), P2 (walkthrough.jsonl), P4
  # (buyer-profile.md, copy) for doc:true modules, and P0.5 (doc-plan.yaml).
  # ------------------------------------------------------------------
  - id: provision-capture
    skill: odoo-doc-illustration
    nl_trigger: >
      Delegate to the odoo-doc-illustration skill, which owns the per-instance incremental
      provision-capture loop. Forward: WORKTREE_PATH = scope.yaml's doc_root (a linked worktree -
      the skill uses it as is), doc-plan at <OUT>/<run>/doc-plan.yaml, scope at
      <OUT>/<run>/scope.yaml, CAPTURE MODE: scenarios, DOC SCOPE: full-guide, and per module from
      <DOC><module>/: FEATURE CATALOG (feature-catalog.jsonl), ROLE MAP (role-map.json),
      WALKTHROUGH (walkthrough.jsonl), BUYER PROFILE (buyer-profile.md), MARKETING COPY (the
      per-locale copy) and TARGET MARKET (the confirmed target_market) - do NOT re-fetch; pass
      directly to the skill.
    model_tier: sonnet
    gate: "approve / refine: [feedback] / cancel"

  # ------------------------------------------------------------------
  # Phase 6 - Manifest audit (inline, per doc:true module)
  # Browser-free.
  # ------------------------------------------------------------------
  - id: manifest-audit
    inline: true
    model_tier: sonnet
    gate: "approve / skip / cancel"   # approve = save the audit; skip = do not save
    # For each module with doc:true in <OUT>/<run>/doc-plan.yaml (skip doc:false
    # dedup modules - they are install-only deps, not documented), audit App-Store manifest keys
    # in doc_root:
    #   REQUIRED (blocking if missing): name, summary, description, license, category
    #   COVER (blocking): run the reference gate of snippets/module-doc-references.md on the module
    #     (no file arguments); any MANIFEST_IMAGE, MANIFEST_COVER or IMG_HERO_NOT_COVER finding
    #     is a blocking cover gap - the gate owns the cover rule
    #   RECOMMENDED (warning if missing): support, website, maintainer, application
    #   OPTIONAL (info): live_test_url, price, currency, version
    # Suggest values for missing non-commercial fields. NEVER fabricate commercial keys
    # (price / live_test_url / currency - these are instance/commercial-specific and must
    # only be set by the module owner). Score each module: required-missing = blocking,
    # recommended-missing = warning, optional-missing = info. Write per-module results to
    # <OUT>/<run>/<module>/manifest-audit.md.

  # ------------------------------------------------------------------
  # Phase 7 - Aggregate index (inline)
  # Browser-free.
  # ------------------------------------------------------------------
  - id: aggregate-index
    inline: true
    model_tier: inherit
    gate: "approve / skip / cancel"   # approve = write the index; skip = do not write
    # Collect all per-module output paths (icon.png, index.html, doc/index.rst, per-locale
    # variants, feature-catalog.md, role-map.json, walkthrough.jsonl, walkthrough.md,
    # buyer-profile.md, manifest-audit.md) for each doc:true module from doc_root, <DOC><module>/
    # and <OUT>/<run>/<module>/, and write a combined run index at <OUT>/<run>/index.jsonl
    # listing every artifact:
    # {module, locale, artifact_type, path, status: captured|degraded|placeholder}.
    # Emit a run summary to the user: doc_root (and its branch when Phase 0.5 created the worktree),
    # modules packaged (doc:true), modules skipped as install-only
    # deps (doc:false + dedup_reason), instances allocated, locales covered, total artifacts,
    # any `concerns:` items (capture downgrades, W=1 serialization, missing rasterizer,
    # locale fallbacks, manifest-audit blocking gaps). Note: final HTML/RST artifacts and images
    # are committed in the module tree under doc_root (e.g. <module>/static/description/index.html);
    # <DOC> holds the catalog, role map, walkthroughs, buyer profile and copy; <OUT>/<run>/ holds
    # scope.yaml, doc-plan.yaml, the audit reports and the run index.
