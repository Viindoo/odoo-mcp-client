name: video-produce
domain: marketing
team_pattern: Pipeline
description: |
  Produce a multi-scene Odoo demo video from one approved storyboard: scenes with structured
  click paths, timing and a narration per scene and language; one recording per narration
  language with the UI in that language, driven and recorded by the plugin's recorder script;
  narration through the configured speech endpoint; one publish-ready MP4 per language (or a
  silent MP4 / GIF) with captions, thumbnail, chapters and preview; then PUBLISH where the caller
  says: the YouTube channel of a purpose (docs | marketing) through the odoo-media server, the
  pull request as an attachment, or nowhere. Trigger: "multi-scene Odoo demo video", "storyboard
  and record", "assemble scenes into one video", "narrated demo video", "tutorial video",
  "upload the demo to YouTube", "publish the video", "record storyboard", "multi-take product
  demo", "quay nhiều scene ghép thành một video demo", "đăng video lên YouTube", "make a 3-scene
  walkthrough", "record and stitch demo clips"
output_dir: .odoo-ai/video
inputs:
  - project_label
  - scenes
  - output_format
  - languages       # locales; for a video that docs or an App Store page embed: the UNION of the
                    # targets' languages - narrower only with a reason shown at the plan gate
  - destination     # none (default: the file stays local) | pr | youtube | youtube:<purpose>
  - targets         # optional: the surfaces that will embed it (docs-site row key, module, store page)
  - video_type      # tutorial | marketing (default: marketing when the destination's purpose is marketing, else tutorial)

resume: true
fallback: standalone

# Layout, every artifact under <ISOLATE_DIR>/video/<project_label>/: storyboard.json (the
# plan), storyboard.md (its rendering for the gate), scripts/ (scene scripts), takes/<lang>/,
# narration/<lang>/, assembly/<lang>/, deliverables/<lang>/, ledger.jsonl (AI spend),
# findings.md (product defects seen on screen). Nothing in a temporary directory. Scripts:
# ${CLAUDE_PLUGIN_ROOT}/scripts/lib/{storyboard_check,video_record,video_budget,video_keyscan,
# video_publish,narration_check,pronunciation}.py; every one prints KEY=VALUE lines.

phases:
  - id: storyboard
    inline: true
    plan: true
    model_tier: sonnet
    # Inputs the runner collects: project_label (default "Demo-Project"); scenes (ordered
    # descriptions); output_format (mp4 | gif, default mp4); languages (locales; empty = silent;
    # each language is its own recording with the UI in that language; when `targets` names
    # docs or an App Store page, languages = the union of the targets' languages, a narrower set
    # is a decision the gate shows with its reason); destination (asked when unset, never
    # assumed; a default is offered only after the odoo-media youtube_check for the purpose
    # ran); targets; video_type (decides the script rules, the voice ranking, the speaking rate,
    # the music default and the shot length).
    # Series per snippets/project-facts-resolution.md; instance per snippets/instance-resolution.md.
    # Preflight, before anything is written: narrated run ->
    #   bash ${CLAUDE_PLUGIN_ROOT}/scripts/setup-steps/70-speech.sh check  (exit 1 = NEEDS_CONTEXT
    #   naming `/odoo-ai-agents:odoo-setup voice`; never ask for a key or an endpoint in chat) and
    #   the odoo-media `media_info` tool (`speech.value_present` false = NEEDS_CONTEXT naming the
    #   option);
    #   python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/video_publish.py verify-tools  (VERDICT=fail stops
    #   with its REMEDY lines); python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/video_record.py self-test
    #   (exit 1 stops with its lines and `/odoo-ai-agents:odoo-setup browser`).
    # Write storyboard.json per ${CLAUDE_PLUGIN_ROOT}/skills/odoo-demo-recording/references/storyboard.md
    # (the schema), then `storyboard_check.py check` until exit 0, `storyboard_check.py render` to
    # storyboard.md, `video_budget.py estimate`. The plan the gate shows = storyboard.md + the
    # estimate + the instance to build. Rules the storyboard encodes:
    #   - Every scene's click_path is structured actions (`do` objects); a human string beside
    #     them is allowed, a scene with no action is not recordable.
    #   - A shot opens when the result appears and cuts at the click; no still frame longer than
    #     max_hold_s without narration; marketing shots 2-4 s, a tutorial's longer, under the cap.
    #   - Narration is SPOKEN text: sentences of 8-15 words with one idea each
    #     (narration_check.py refuses a longer one), a hook in the first 5 seconds, second
    #     person, the benefit before the feature, marketing shows the result first; written brands
    #     and acronyms (the pronunciation map respells them for the engine only).
    #     One sentence never spans two lines: the engine pauses at every line break as at a full
    #     stop. No term a target docs-site row bans (`docs_site_config.py show --key
    #     <row>` policy.banned_terms); URLs said as the author profile states them; the viewer is
    #     talked through what is on screen so the screen never moves longer than max_silence_s
    #     with nobody speaking.
    #   - Voice and music, once per project: `speech_voices` listing ranked for the video type
    #     (conversational first; a news or story style last for marketing); no listing ->
    #     audition every speech.toml `tts.candidates` voice on the hook line
    #     (`speech_synthesize` with `voice`, `speech_transcribe` + narration_check,
    #     `video_publish.py audition --music <author profile music_file>`), ONE AskUserQuestion
    #     per language (the voice; music on or off); no voice name is written in plugin prose.
    #     Speaking rate = speech.toml `tts.rate` for the video type, verified by `speech_probe`
    #     with `speed` (`speed_honoured` false -> keep 1.0 and say so).
    #   - Pronunciation: the machine registry (`pronunciation.py registry list`) always applies;
    #     the storyboard map only adds terms; `registry missing --lang --text --map` per
    #     language, every MISSING term asked once and recorded with `registry add --confirmed`.
    #   - AI feature in a scene: the `ai` block carries requests_per_scene, tokens_per_request,
    #     takes, trials_k, key_env (the NAME of the variable, dedicated to demos), quota_note
    #     (what the app's settings page says about per-database limits); `key_scope` is asked
    #     once as a closed question (dedicated | shared); shared is refused. The estimate is
    #     shown at the gate.
    #   - Abstract labels only (no real customer name in a saved file); demo_data actions seed
    #     the scratch database through the UI, fictitious names, archived noise, stable rankings.
    #   - A narration language with no recorded voice is NEEDS_CONTEXT, never a guess.

  - id: record-scenes
    agent: odoo-video-producer
    nl_trigger: >
      Launch odoo-video-producer with MODE: record, the storyboard path, LANGUAGES, the
      INSTANCE_HANDLE of the demo build (built or forwarded per the storyboard phase's plan;
      the language packs loaded; the producer never releases it), WORKTREE_PATH, ODOO VERSION,
      PROFILE, SHARE_DIR, ISOLATE_DIR, RUN_ID, AUTHOR PROFILE, BUDGET_MARGIN. Keep the id the
      launch returns as WORKER_AGENT_ID; the next two phases resume that agent. A NEEDS_CONTEXT
      on a scene, a budget or a key field on screen goes to the storyboard owner before any retake.
    model_tier: sonnet

  - id: narrate
    agent: odoo-video-producer
    nl_trigger: >
      Narrated run only (skip when `languages` is empty). Resume WORKER_AGENT_ID with MODE:
      narrate and the same brief; a `listen` line is kept for the publish gate, a NEEDS_CONTEXT
      line goes back to the storyboard owner. A narration-only fix re-runs this phase and
      assemble; never record-scenes.
    model_tier: sonnet

  - id: assemble
    agent: odoo-video-producer
    nl_trigger: >
      Resume WORKER_AGENT_ID with MODE: assemble and the same brief. Its report carries, per
      language, the deliverable path under deliverables/<lang>/, the verify lines, the listen
      lines, the budget figures and findings.md; a BLOCKED (a key field on screen, a failed verify) stops
      the workflow with those lines. Silent run: the scene clips paced and concatenated with a
      silent track, no narration, verified with `--silent`. Recorder unavailable for a scene: the producer says so and the scene is
      recorded by odoo-demo-recording's MCP path, assembled from its clip.
    model_tier: sonnet

  - id: publish
    inline: true
    model_tier: haiku
    # Runs LAST and only when `destination` says so (${CLAUDE_PLUGIN_ROOT}/snippets/video-destination.md).
    # Before any upload: the `listen` lines are the human gate (AskUserQuestion, one answer per
    # language: approve / refine: [the line to re-voice] / cancel; a refine goes back to narrate),
    # and `video_keyscan.py scan --dir <ISOLATE_DIR>/video/<project_label>` must exit 0.
    #   - `pr`: hand the `preview` rendition and the PR to git-toolkit:git-ops to attach it to the
    #     PR body or a comment; the caller's size cap applies.
    #   - `youtube` or `youtube:<purpose>` (default purpose `docs`; `marketing` for a sales or
    #     marketing video): odoo-media `youtube_check` (channel = purpose, live = true) first -
    #     YOUTUBE_CHANNEL_UNKNOWN / YOUTUBE_NOT_CONFIGURED = the video stays local and the return
    #     names its path and `/odoo-ai-agents:odoo-setup youtube`; VALUE_NOT_CONFIGURED =
    #     NEEDS_CONTEXT naming the option. Then per language `youtube_upload` (channel, video,
    #     title from publish.<lang>.title, description_file deliverables/<lang>/<lang>.txt, language,
    #     captions {<lang>: deliverables/<lang>/<lang>.srt}, thumbnail); record per language {video_id,
    #     lang, purpose, watch_url, embed_url} as `videos` in the return (the run file's
    #     produced.videos, read by the plan's publish-videos node). Privacy is the channel's
    #     default (unlisted) unless the caller states `public`, confirmed with the user first.
    #   - `none` (default): the deliverables stay under the run directory.
    # Then delete takes/, narration/ and assembly/ (deliverables, storyboard, ledger and
    # findings stay until the run that owns them ends).
