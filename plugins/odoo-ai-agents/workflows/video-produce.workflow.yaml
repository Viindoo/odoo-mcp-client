name: video-produce
domain: marketing
team_pattern: Pipeline
description: |
  Produce a multi-scene Odoo demo video: author a storyboard (scene list with click
  paths, timing and, when narrated, a narration per scene and language), record each
  scene via the odoo-demo-recording primitive - one recording per narration language, with
  the UI in that language - synthesise the narration through the configured speech endpoint,
  assemble one publish-ready MP4 per language (or a silent MP4 / GIF), then PUBLISH it where
  the caller says: the YouTube channel of a purpose (docs | marketing) through the odoo-media
  server, the pull request as an attachment, or nowhere (the file stays local). Trigger:
  "multi-scene Odoo demo video", "storyboard and record", "assemble scenes into one video",
  "narrated demo video", "tutorial video", "upload the demo to YouTube", "publish the video",
  "record storyboard", "multi-take product demo", "quay nhiều scene ghép thành một video demo",
  "đăng video lên YouTube", "make a 3-scene walkthrough", "record and stitch demo clips"
output_dir: .odoo-ai/video
inputs:
  - project_label
  - scenes
  - output_format
  - languages       # locales; for a video that docs or an App Store page embed: the UNION of the
                    # targets' languages - narrower only with a reason shown at the plan gate
  - destination     # none (default: the file stays local) | pr | youtube | youtube:<purpose>
  - targets         # optional: the surfaces that will embed it (docs-site row key, module, store page)

resume: true
fallback: standalone

phases:
  - id: storyboard
    inline: true
    plan: true
    model_tier: sonnet
    # Runner collects:
    #   - project_label  (default "Demo-Project")
    #   - scenes         (ordered list of scene descriptions, e.g. "1. Create invoice 2. Confirm")
    #   - output_format  (mp4 or gif; default mp4)
    #   - languages      (narration languages as locales, e.g. vi_VN,en_US; empty = silent video).
    #                    EACH language is its own recording with the UI in that language: a
    #                    tutorial's screen must speak the narration's language. When `targets`
    #                    names docs or an App Store page, languages = the union of the targets'
    #                    languages (the docs-site row's `languages`, the module's i18n); a
    #                    narrower set is a decision the plan gate shows with its reason.
    #   - destination    (none | pr | youtube | youtube:<purpose>; where the publish phase sends the
    #                    result; an unset destination is asked, never assumed - a default is only
    #                    offered after the odoo-media youtube_check for the purpose was run)
    #   - targets        (optional: what embeds the video - a docs-site row key, a module's guide
    #                    or App Store page - decides languages and purpose)
    # Resolves the series per snippets/project-facts-resolution.md and the instance target
    # per snippets/instance-resolution.md.
    # Narrated run (languages given): read the speech configuration FIRST -
    #   bash ${CLAUDE_PLUGIN_ROOT}/scripts/setup-steps/70-speech.sh check
    # exit 1 = stop with NEEDS_CONTEXT naming `/odoo-ai-agents:odoo-setup voice` (a voice per
    # requested language must be recorded there); never ask for a key or an endpoint in chat.
    # Then `python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/video_publish.py verify-tools` (ffmpeg, the
    # filters, the title-card renderer, the font and its Vietnamese coverage): VERDICT=fail stops
    # here with the REMEDY lines, before anything is recorded. The odoo-media `media_info` tool
    # says whether the speech option is set; `speech_probe` proves the round trip per language.
    # Produces the storyboard as Markdown AND as storyboard.json
    # (<ISOLATE_DIR>/video/<project_label>/storyboard.json), the plan approved once:
    #   { "title", "languages": [...], "lead_in_s": 0.5, "fade_s": 0.3, "max_silence_s": 3.0, "publish_profile":
    #     "youtube-1080p", "pronunciation": {"<lang>": [{"written","spoken","kind"}]},
    #     "scenes": [{ "id", "title": {"<lang>": ...}, "click_path": [...],
    #                  "target_seconds", "narration": {"<lang>": "..."},
    #                  "must_see": [[start_s, end_s]] }],
    #     "publish": {"<lang>": {"title", "description"}} }
    # Narration per scene and language is written for the ear: short sentences, the
    # written form of every brand and acronym (the pronunciation map respells them for the
    # engine only), no term the embedding docs site bans (`docs_site_config.py show --key <row>`
    # policy.banned_terms, when a target is a docs-site row) and URLs said the way the author
    # profile states them (the page by its name, never spelled out), and it talks the viewer
    # through the scene - what is on the screen, why the
    # user does this, what to look at next - so the screen never moves for longer than
    # max_silence_s with nobody speaking; a scene whose click path outlasts what there is to say
    # is cut or merged, never left as silent recording. One sentence never spans two lines: the
    # speech engine pauses at every line break as at a full stop, so the text holds one sentence
    # (or several) per line and breaks only after sentence-final punctuation. Hard rules enforced
    # inline:
    #   - No writes before the storyboard is decided
    #   - Abstract labels only (no real customer names in saved files)
    #   - Each scene maps to one odoo-demo-recording invocation
    #   - A narration language with no recorded voice is a NEEDS_CONTEXT, never a guess
    #   - The storyboard holds every tunable (lead-in, fade, profile); nothing is hardcoded later
    #   - Pronunciation: the machine registry (`pronunciation.py registry list`, recorded by
    #     odoo-setup voice: the vendor brand, the AI vendors and models the product shows,
    #     acronyms, each pronounced the English way per language) ALWAYS applies and is never
    #     overridden; the storyboard map only ADDS terms for this video. Run
    #     `pronunciation.py registry missing --lang <lang> --text <narration> --map <map>` per
    #     language: every MISSING term is asked of the operator once (a respelling, confirmed by
    #     ear from a `speech_synthesize` clip) and recorded with `registry add --confirmed`, or
    #     added to this video's map - never guessed silently.

  - id: record-scenes
    skill: odoo-demo-recording
    nl_trigger: >
      Record all scenes from the storyboard produced in the storyboard phase, ONCE PER
      NARRATION LANGUAGE (a silent video: once): before a language's scenes, switch the demo
      user's interface language to that language the way the plugin's documentation captures do
      (through the UI, never a database write), and name each clip {project_label}-{lang}-scene-N.
      For each scene in order: plan the click path using the storyboard description,
      then set up deterministic demo state and drive the planned path in the SAME
      browser the recorder records - with pagecast, inside the pagecast session
      (interact_page actions: navigate / type / press / click / hover / select / scroll /
      wait); with playwright, the playwright tools around
      browser_start_video / browser_stop_video - never drive with chrome-devtools while a
      recording runs. Stop the recorder (stop_recording or browser_stop_video), then CLOSE
      every page you DROVE this scene before starting the next scene. Use {project_label}-{lang}-scene-N as the scene's feature name, so its clip
      lands at odoo-demo-recording's own absolute path
      <ISOLATE_DIR>/visual/videos/{project_label}-{lang}-scene-N-<YYYYMMDD>-<4 random chars>.{mp4,gif}.
      Never pass a relative path to a capture tool. Both the stop and the close are mandatory per
      scene, including a retake - see
      ${CLAUDE_PLUGIN_ROOT}/snippets/resource-teardown-contract.md T0 and T2 - Browser: close
      what you drove.
      After all scenes are recorded, report each clip path and duration.
      If a scene's storyboard description says "narrated", "before/after evidence", or carries a
      --label before|after, dispatch that scene's odoo-demo-recording invocation in Narrated
      evidence mode instead of the default flow - same clip-path convention, no change to this phase otherwise.
      Retake: when the user asks to retake a scene, re-record that scene only (stop + close it
      too) and assemble again.
    model_tier: sonnet

  - id: narrate
    inline: true
    model_tier: haiku
    # Narrated run only (skip when `languages` is empty). For each scene and each language:
    #   1. Write the narration text to <ISOLATE_DIR>/video/<project_label>/narration/<lang>/<scene>.txt,
    #      check its shape (`python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/narration_check.py --script <txt>`:
    #      exit 1 = a sentence runs on to the next line; rejoin it before any synthesis), and run
    #      the pronunciation self-check once per run:
    #        python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/pronunciation.py selfcheck --map <storyboard pronunciation as JSON>
    #   2. Synthesise with the odoo-media tool `speech_synthesize` (text_file <txt>, lang, out
    #      .../narration/<lang>/<scene>.wav, pronunciation = the storyboard map): the endpoint's
    #      value is the plugin's configured option, which only that server holds; a
    #      VALUE_NOT_CONFIGURED result is a NEEDS_CONTEXT naming the option, never a question for
    #      a value in chat. One clip at a time (the endpoint is a shared service).
    #   3. Check it: the odoo-media tool `speech_transcribe` (audio <wav>, lang) -> <scene>.stt.txt, then
    #        python3 ${CLAUDE_PLUGIN_ROOT}/scripts/lib/narration_check.py --script <txt> --transcript <stt.txt>
    #          --slots "<brands and acronyms of the scene>" --map <map.json> --lang <lang>
    #      exit 1 = generate another take (at most 3 per line) and keep the lowest WER;
    #      exit 3 = keep the take and list the line under "listen" (STT cannot tell an acronym
    #      read letter by letter from the word, nor judge a brand or a URL - a human listens):
    #      every line holding a registered term or a URL is a "listen" line.
    #   4. Record durations per scene and language in .../narration/<lang>/durations.json
    #      ({"<scene id>": seconds}) for the assembler.
    # A narration-only fix re-runs this phase and assemble; never record-scenes.

  - id: assemble
    inline: true
    model_tier: sonnet
    # Runner assembles one deliverable per language (or one silent deliverable):
    #   0. Tools: `command -v ffmpeg ffprobe`; without them deliver the per-scene clips in
    #      storyboard order and say why the single file was not produced. pagecast
    #      convert_to_mp4 / convert_to_gif convert ONE clip each and never join clips.
    #      Every ffmpeg step below goes through ${CLAUDE_PLUGIN_ROOT}/scripts/lib/video_publish.py
    #      so the publish profile is applied once, from data.
    #   1. Narrated: per scene and language, with THAT language's clip, `video_publish.py fit --clip <scene clip> --narration <wav>
    #      --out .../assembly/<lang>/<scene>.mp4 --lead-in <storyboard lead_in_s> --fade <fade_s>
    #      --max-silence <storyboard max_silence_s>` (narration after the lead-in; the last frame
    #      held when it outlasts the clip). Exit 4 = the screen moves longer than max_silence_s
    #      with nobody speaking: extend that scene's narration with what the screen shows (back to
    #      narrate for the scene) or shorten its click path (back to record-scenes); never ship it.
    #      Silent: the scene clips as recorded.
    #   2. Optional title card: `video_publish.py title --text "<storyboard title for the language>"
    #      --out .../assembly/<lang>/00-title.mp4 --font <author profile font_file>` (drawtext, or
    #      libass on a build without it - verify-tools said which; neither = skip the card and say so).
    #   3. `video_publish.py concat --list <ordered clip list> --out
    #      <ISOLATE_DIR>/video/<project_label>-<lang>-<YYYY-MM-DD>.mp4` (re-encode to the profile,
    #      two-pass loudnorm). A gif deliverable: pagecast convert_to_gif on the concatenated mp4.
    #   4. `video_publish.py verify --video <final> --profile <storyboard publish_profile>`: any FAIL
    #      line fails the run - report the lines, never ship the file as publish-ready.
    #   5. Side files per language: `video_publish.py sidecar --storyboard storyboard.json --lang
    #      <lang> --durations <durations.json> --out-dir .../deliverables/<lang>/` (captions .srt,
    #      title + description + chapters .txt), `video_publish.py thumbnail --video <final> --at
    #      <a storyboard key frame> --out .../deliverables/<lang>/thumbnail.jpg`, and
    #      `video_publish.py preview --video <final> --out .../deliverables/<lang>/preview.mp4
    #      --max-mb 10`.
    #   6. Frame spot check per scene (open 2 frames per scene with the plugin browser or ffmpeg
    #      -frames:v 1 and look): the right UI language, no settings form and no long opaque
    #      string (a pasted key) on screen; then grep every kept text file for the shapes of a
    #      pasted key (`sk-`, `Bearer `). A hit fails the run.
    #   7. Print per language: the artifact paths, total duration, scene count, the verify lines,
    #      the "listen" lines of narrate, product defects seen on screen (for the product team,
    #      never edited out), and the re-runnable storyboard.
    # Fallback: if only screenshot capture was available for any scene, the assembler
    # stitches frame sequences and prefixes the output with:
    #   ⚠ Recorder unavailable for scene(s) N - assembled from screenshot frames.
    # All artifacts stay under <ISOLATE_DIR>/video/<project_label>/ (storyboard.json, takes/,
    # narration/, assembly/, deliverables/); nothing in a temporary directory.

  - id: publish
    inline: true
    model_tier: haiku
    # Runs LAST and only when the caller's `destination` says so (the rule and the destinations:
    # ${CLAUDE_PLUGIN_ROOT}/snippets/video-destination.md). BEFORE any upload:
    # the "listen" lines of narrate are the human gate - give the operator each clip path and its
    # line (AskUserQuestion, one answer per language: approve / refine: [the line to re-voice] /
    # cancel); a refine goes back to narrate for that line, never to publishing.
    #   - `pr`: hand the `preview` rendition and the PR to git-toolkit:git-ops with the request to
    #     attach it to the PR body or a comment; the caller's size cap applies.
    #   - `youtube` or `youtube:<purpose>` (purpose defaults to `docs`; `marketing` for a sales or
    #     marketing video): the odoo-media tool `youtube_check` (channel = purpose, live = true)
    #     first - YOUTUBE_CHANNEL_UNKNOWN / YOUTUBE_NOT_CONFIGURED = the video stays local, the
    #     return names its path and `/odoo-ai-agents:odoo-setup youtube`; VALUE_NOT_CONFIGURED =
    #     NEEDS_CONTEXT naming the option - then per language the odoo-media tool `youtube_upload`
    #     (channel, video <final>, title "<publish title>", description_file
    #     <deliverables/<lang>.txt>, language <lang>, captions {<lang>: <deliverables/<lang>.srt>},
    #     thumbnail <thumbnail.jpg>); record per language {video_id, lang, purpose, watch_url,
    #     embed_url} as `videos` in the return - the run file's produced.videos, which the plan's
    #     publish-videos node reads to make them public once the PR that embeds them merged.
    #     Privacy is the channel's default (unlisted) unless the caller states `public`, which is
    #     confirmed with the user first; the caller is who embeds the URL.
    #   - `none` (default): no publishing; the deliverables stay under the run directory.
    # Then delete <ISOLATE_DIR>/video/<project_label>/takes/, narration/ and assembly/ (the
    # deliverables stay until the run that owns them ends and removes the whole label directory).
