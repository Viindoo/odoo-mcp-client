# video-produce.workflow.yaml
# Declarative SSOT for the /odoo-produce-video command.
# Runner: skills/workflow-chaining - auto-discovered at runtime.
name: video-produce
domain: marketing
team_pattern: Pipeline
description: |
  Produce a multi-scene Odoo demo video: author a storyboard (scene list with click
  paths and timing), record each scene via the odoo-demo-recording primitive, then
  assemble all clips into a single MP4 or GIF deliverable. Trigger: "multi-scene
  Odoo demo video", "storyboard and record", "assemble scenes into one video",
  "record storyboard", "multi-take product demo", "quay nhiều scene ghép thành
  một video demo", "make a 3-scene walkthrough", "record and stitch demo clips"
output_dir: .odoo-ai/video
inputs:
  - project_label
  - scenes
  - output_format

resume: true
fallback: standalone

phases:
  # ------------------------------------------------------------------
  # Phase 0 - Parse args + context check + storyboard (inline gate)
  # ------------------------------------------------------------------
  - id: storyboard
    inline: true
    model_tier: sonnet
    gate: "approve / refine: [feedback] / cancel"
    # Runner collects:
    #   - project_label  (default "Demo-Project")
    #   - scenes         (ordered list of scene descriptions, e.g. "1. Create invoice 2. Confirm")
    #   - output_format  (mp4 or gif; default mp4)
    # Resolves the series per snippets/project-facts-resolution.md and the instance target
    # per snippets/instance-resolution.md.
    # Produces a Markdown storyboard: scene index, workflow description, estimated
    # duration, key actions (menu → record → field → action), and output filename.
    # Hard rules enforced inline:
    #   - No writes before gate approval
    #   - Abstract labels only (no real customer names in saved files)
    #   - Each scene maps to one odoo-demo-recording invocation

  # ------------------------------------------------------------------
  # Phase 1 - Record scenes (odoo-demo-recording, one invocation per scene)
  # ------------------------------------------------------------------
  - id: record-scenes
    skill: odoo-demo-recording
    nl_trigger: >
      Record all scenes from the storyboard produced in the storyboard phase.
      For each scene in order: plan the click path using the storyboard description,
      then log in, set up deterministic demo state and drive the planned path in the SAME
      browser the recorder records - with pagecast, inside the pagecast session
      (interact_page actions: navigate / type / press / click / hover / select / scroll /
      wait; the login included); with playwright, the playwright tools around
      browser_start_video / browser_stop_video - never drive with chrome-devtools while a
      recording runs. Stop the recorder (stop_recording or browser_stop_video), then CLOSE
      every page you DROVE this scene before starting the next scene. Use {project_label}-scene-N as the scene's feature name, so its clip
      lands at odoo-demo-recording's own absolute path
      <ISOLATE_DIR>/visual/videos/{project_label}-scene-N-<YYYYMMDD>-<4 random chars>.{mp4,gif}.
      Never pass a relative path to a capture tool. Both the stop and the close are mandatory per
      scene, including a retake - see
      ${CLAUDE_PLUGIN_ROOT}/snippets/resource-teardown-contract.md T0 and T2 - Browser: close
      what you drove.
      After all scenes are recorded, report each clip path and duration so the user
      can review before assembly.
      If a scene's storyboard description says "narrated", "before/after evidence", or carries a
      --label before|after, dispatch that scene's odoo-demo-recording invocation in Narrated
      evidence mode instead of the default flow - same gate, same clip-path convention, no change to this phase otherwise.
      Support retake: if the user marks a scene for retake,
      re-record that scene only (stop + close it too) before proceeding to assembly.
    model_tier: sonnet
    gate: "approve / refine: [feedback] / cancel"   # refine: [scene numbers] re-takes just those scenes

  # ------------------------------------------------------------------
  # Phase 2 - Assemble clips into final deliverable (inline gate)
  # ------------------------------------------------------------------
  - id: assemble
    inline: true
    model_tier: sonnet
    gate: "approve / skip / cancel"   # approve = save the artifact; skip = do not save
    # Runner assembles the individual scene clips into a single deliverable:
    #   1. Concatenate the scene clips reported by Phase 1 (under <ISOLATE_DIR>/visual/videos/)
    #      in storyboard order with ffmpeg (check `command -v ffmpeg` first); pagecast
    #      convert_to_mp4 / convert_to_gif convert ONE clip each and never join clips.
    #      Without ffmpeg, deliver the per-scene clips in storyboard order and say the
    #      single file was not produced because ffmpeg is missing.
    #   2. Write final file to <ISOLATE_DIR>/video/<project_label>-<YYYY-MM-DD>.<mp4|gif>
    #   3. Print artifact path, total duration, scene count, and the re-runnable storyboard.
    #   4. Remind: <ISOLATE_DIR> is the per-worktree ISOLATE dir under the state root,
    #      outside the repo - the final file is not committed.
    # Fallback: if only screenshot capture was available for any scene, the assembler
    # stitches frame sequences and prefixes the output with:
    #   ⚠ Recorder unavailable for scene(s) N - assembled from screenshot frames.
